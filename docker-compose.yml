services:
  db:
    image: postgres:16-alpine
    container_name: tutorhub-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tutorhub}
      POSTGRES_USER: ${POSTGRES_USER:-tutorhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tutorhub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tutorhub-redis
    ports:
      - "6379:6379"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000"
    env_file:
      - path: ./config/.env
        required: false
      - path: ./.env
        required: false
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A config worker -l info
    env_file:
      - path: ./config/.env
        required: false
      - path: ./.env
        required: false
    volumes:
      - .:/app
    depends_on:
      - db
      - redis

  ai_service:
    build:
      context: ./ai_service
    container_name: tutorhub-ai-service
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    env_file:
      - path: ./config/.env
        required: false
      - path: ./.env
        required: false
    volumes:
      - ./ai_service:/app
    ports:
      - "8001:8001"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: tutorhub-frontend
    profiles:
      - dev-frontend
    environment:
      VITE_DJANGO_PROXY_TARGET: http://web:8000
      VITE_AI_PROXY_TARGET: http://ai_service:8001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - web
      - ai_service

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: tutorhub-nginx
    ports:
      - "8000:80"
    volumes:
      - static_volume:/app/staticfiles:ro
    depends_on:
      - web
      - ai_service

volumes:
  postgres_data:
  static_volume:
